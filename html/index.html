<!DOCTYPE html>

<head>
    <title>My Website</title>
    <style>
        *,
        html {
            margin: 0;
            padding: 0;
            border: 0;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: rgb(236, 152, 42);
        }

        .center {
            width: 100%;
            height: 50%;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: "Trebuchet MS", Helvetica, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 144px;
        }

        p {
            font-size: 64px;
        }
    </style>
</head>

<body>
    <div class="center">
    <button data-room="salon" data-device="lumiere1" data-action="on">Salon : lumière 1 allumée</button>
    <button data-room="salon" data-device="lumiere1" data-action="off">Salon : lumière 1 éteinte</button>
    <button data-room="cuisine" data-device="lumiere1" data-action="on">Cuisine : lumière 1 allumée</button>
    </div>


    <script>
        document.querySelectorAll("button[data-room]").forEach((bouton) => {
        bouton.addEventListener("click", () => {
                    fetch("/command", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            room: bouton.dataset.room,
                            device: bouton.dataset.device,
                            action: bouton.dataset.action,
                        }),
                    });
                });
            });

    </script>

</body>

</html>

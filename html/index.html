<!DOCTYPE html>

<head>
    <title>My Website</title>
    <link rel="stylesheet" href="style.css"/>
    <meta name="viewport" content="width=device-width, user-scalable=no">

</head>

<body>

	<div class="container">
		<button data-room="salon" data-device="lumiere1" data-action="toggle">
			L1
		</button>
		<button data-room="cuisine" data-device="lumiere1" data-action="toggle">
			<span class="button_top"> L2 </span>
		</button>
	</div>


    <script>
        document.querySelectorAll("button[data-room]").forEach((bouton) => {
        bouton.addEventListener("click", () => {
                    fetch("/cmd", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            room: bouton.dataset.room,
                            device: bouton.dataset.device,
                            action: bouton.dataset.action,
                        }),
                    });
                });
            });

    </script>

</body>

</html>
